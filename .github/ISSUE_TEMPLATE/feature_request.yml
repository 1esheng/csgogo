name: Feature request
description: Suggest a change to the game or the codebase
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not the solution yet
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cards and collection
        - Lineup and tactics
        - Match engine
        - Career and tournaments
        - Coaching
        - Economy
        - UI and accessibility
        - Tooling and CI
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the README and existing issues
          required: true
        - label: This does not require commercial assets or third-party copyrighted content
          required: true
